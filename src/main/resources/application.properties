# 1. Đường dẫn kết nối đến Postgres (Thay "ten_database_cua_ban" bằng tên DB bạn đã tạo)
spring.datasource.url=jdbc:postgresql://localhost:5432/ranobe_web

# 2. Tài khoản và mật khẩu đăng nhập PostgreSQL của bạn (thường mặc định lúc cài là postgres)
spring.datasource.username=postgres
spring.datasource.password=123456

# 3. Cấu hình tự động sinh bảng từ Class OOP (Code-First)
# "update" nghĩa là: Nếu database chưa có bảng, Java tự tạo. Nếu có rồi và bạn sửa Class Java, Java tự cập nhật thêm cột.
spring.jpa.hibernate.ddl-auto=update

# 4. Chọn đúng ngôn ngữ SQL của PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 5. In các câu lệnh SQL ra màn hình console để bạn dễ theo dõi/debug khi code chạy
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Turn off warning open-in-view
spring.jpa.open-in-view=false