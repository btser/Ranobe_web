# 1. Link to SQL server
spring.datasource.url=jdbc:postgresql://localhost:2405/ranobe_web

# 2. SQL account [postgreSQL]
spring.datasource.username=postgres
spring.datasource.password=123456

# 3. Auto update in SQL servers
spring.jpa.hibernate.ddl-auto=update

spring.datasource.driver-class-name=org.postgresql.Driver
# 4. Select SQL language
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 5. In các câu lệnh SQL ra màn hình console để theo dõi/debug khi code chạy
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Turn off warning open-in-view
spring.jpa.open-in-view=false

spring.main.banner-mode = off

logging.level.root = warn

spring.java.show-sql = false