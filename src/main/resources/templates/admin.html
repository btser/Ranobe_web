<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="${siteLogoSmall}">
    <title>Quản trị Ranobe</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #121212; color: #e0e0e0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #1e1e1e; padding: 15px 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .logo { font-size: 22px; font-weight: bold; color: #4da6ff; text-decoration: none; }
        .logo { display: inline-flex; align-items: center; gap: 10px; }
        .logo img { width: 38px; height: 38px; border-radius: 10px; display: block; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .panel { background: #1e1e1e; border-top: 4px solid #4da6ff; border-radius: 8px; padding: 22px; margin-bottom: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.45); }
        h1, h2 { margin-top: 0; color: #ffca28; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 11px 9px; border-bottom: 1px solid #333; text-align: left; vertical-align: middle; }
        th { color: #aaa; font-size: 13px; text-transform: uppercase; }
        .tag { display: inline-block; padding: 3px 8px; border-radius: 4px; background: #333; color: #ddd; font-size: 12px; font-weight: bold; }
        .tag.ok { background: #28a745; color: #fff; }
        .tag.danger { background: #dc3545; color: #fff; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        button, .link-btn { border: 0; border-radius: 4px; padding: 7px 10px; color: #fff; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 13px; }
        .primary { background: #007bff; }
        .warning { background: #b88400; }
        .danger { background: #dc3545; }
        .neutral { background: #444; }
        .back-link { color: #888; text-decoration: none; }
        .filters { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; align-items:end; }
        .filters label { display:grid; gap:5px; }
        .filters input, .filters select { background:#252525; color:#eee; padding:9px; border:1px solid #555; border-radius:4px; max-width:100%; }
        .table-wrap { overflow-x:auto; }
        .pages { display:flex; gap:16px; align-items:center; justify-content:center; margin:16px 0 0; }
        .pages a { color:#4da6ff; }
        .filters button { background:#287c48; }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="/" class="logo"><img th:src="${siteLogoSmall}" alt="LN"> Ranobe Kingdom</a>
    <a href="/" class="back-link">Về trang chủ</a>
</nav>

<div class="container">

    <section class="panel">
        <h2>Tác phẩm</h2>
        <form class="filters" method="get" action="/admin">
            <input type="hidden" name="accountQ" th:value="${accountQ}">
            <input type="hidden" name="accountState" th:value="${accountState}">
            <input type="hidden" name="accountPage" th:value="${accountResults.number}">
            <label>Tên truyện<input name="productQ" th:value="${productQ}" maxlength="150" placeholder="Tìm truyện"></label>
            <label>Hiển thị<select name="productState">
                <option value="all" th:selected="${productState == 'all'}">Tất cả</option>
                <option value="hidden" th:selected="${productState == 'hidden'}">Đã ẩn</option>
                <option value="active" th:selected="${productState == 'active'}">Đang hiện</option>
            </select></label>
            <button type="submit">Lọc truyện</button>
        </form>
        <p th:text="${productResults.totalElements} + ' truyện'"></p>
        <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Tên truyện</th>
                <th>Người đăng</th>
                <th>Trạng thái</th>
                <th>Ẩn</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.productId}">1</td>
                <td>
                    <a th:href="@{${product.path}}" th:text="${product.title}" style="color:#4da6ff; text-decoration:none;">Truyện</a>
                </td>
                <td th:text="${product.uploader != null ? product.uploader.userName : 'Ẩn danh'}">User</td>
                <td><span class="tag" th:text="${product.status}">PUBLIC</span></td>
                <td>
                    <span th:class="${product.deleted ? 'tag danger' : 'tag ok'}"
                          th:text="${product.deleted ? 'Đã ẩn' : 'Đang hiện'}">Đang hiện</span>
                </td>
                <td>
                    <div class="actions">

                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        </div>
        <nav class="pages" th:if="${productResults.totalPages > 1}" aria-label="Phân trang truyện quản trị">
            <a th:if="${productResults.hasPrevious()}" th:href="@{/admin(productQ=${productQ},productState=${productState},productPage=${productResults.number - 1},accountQ=${accountQ},accountState=${accountState},accountPage=${accountResults.number})}">Trang trước</a>
            <span th:text="${productResults.number + 1} + ' / ' + ${productResults.totalPages}"></span>
            <a th:if="${productResults.hasNext()}" th:href="@{/admin(productQ=${productQ},productState=${productState},productPage=${productResults.number + 1},accountQ=${accountQ},accountState=${accountState},accountPage=${accountResults.number})}">Trang sau</a>
        </nav>
    </section>

    <section class="panel">
        <h2>Tài khoản</h2>
        <form class="filters" method="get" action="/admin">
            <input type="hidden" name="productQ" th:value="${productQ}">
            <input type="hidden" name="productState" th:value="${productState}">
            <input type="hidden" name="productPage" th:value="${productResults.number}">
            <label>Tìm tài khoản<input name="accountQ" th:value="${accountQ}" maxlength="150" placeholder="Tên đăng nhập, tên hiển thị, email"></label>
            <label>Tình trạng<select name="accountState">
                <option value="all" th:selected="${accountState == 'all'}">Tất cả</option>
                <option value="hidden" th:selected="${accountState == 'hidden'}">Bị khóa</option>
                <option value="active" th:selected="${accountState == 'active'}">Hoạt động</option>
            </select></label>
            <button type="submit">Lọc tài khoản</button>
        </form>
        <p th:text="${accountResults.totalElements} + ' tài khoản'"></p>
        <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Vai trò</th>
                <th>Tình trạng</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="account : ${accounts}">
                <td th:text="${account.accountId}">1</td>
                <td><a th:if="${account.user != null}" th:href="@{/users/{id}(id=${account.user.userId})}" th:text="${account.username}" style="color:#4da6ff">username</a><span th:if="${account.user == null}" th:text="${account.username}"></span></td>
                <td th:text="${account.email}">email</td>
                <td><span class="tag" th:text="${account.role}">USER</span></td>
                <td>
                    <span th:class="${account.deleted ? 'tag danger' : 'tag ok'}"
                          th:text="${account.deleted ? 'Bị ban' : 'Hoạt động'}">Hoạt động</span>
                </td>
                <td>
                    <div class="actions" th:if="${account.accountId != currentAccount.accountId}">
                        <form th:if="${isAdmin and account.role?.name() == 'USER'}" th:action="@{'/admin/accounts/' + ${account.accountId} + '/make-mod'}" method="post">
                            <button class="primary" type="submit">Cấp mod</button>
                        </form>
                        <form th:if="${isAdmin and account.role?.name() == 'MOD'}" th:action="@{'/admin/accounts/' + ${account.accountId} + '/remove-mod'}" method="post">
                            <button class="neutral" type="submit">Gỡ mod</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        </div>
        <nav class="pages" th:if="${accountResults.totalPages > 1}" aria-label="Phân trang tài khoản quản trị">
            <a th:if="${accountResults.hasPrevious()}" th:href="@{/admin(accountQ=${accountQ},accountState=${accountState},accountPage=${accountResults.number - 1},productQ=${productQ},productState=${productState},productPage=${productResults.number})}">Trang trước</a>
            <span th:text="${accountResults.number + 1} + ' / ' + ${accountResults.totalPages}"></span>
            <a th:if="${accountResults.hasNext()}" th:href="@{/admin(accountQ=${accountQ},accountState=${accountState},accountPage=${accountResults.number + 1},productQ=${productQ},productState=${productState},productPage=${productResults.number})}">Trang sau</a>
        </nav>
    </section>
</div>
</body>
</html>
