<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="${siteLogoSmall}">
    <title>Thêm Chương Mới</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #121212; color: #e0e0e0; }
        .navbar { background-color: #1e1e1e; padding: 15px 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .logo { font-size: 22px; font-weight: bold; color: #4da6ff; text-decoration: none; }
        .logo { display: inline-flex; align-items: center; gap: 10px; }
        .logo img { width: 38px; height: 38px; border-radius: 10px; display: block; }
        .form-container { max-width: 800px; margin: 40px auto; padding: 30px; background: #1e1e1e; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #4da6ff; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #ffca28; }
        input[type="text"], textarea { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; color: #fff; box-sizing: border-box; font-size: 15px; }
        textarea { height: 350px; line-height: 1.6; resize: vertical; }
        .btn-submit { background-color: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-submit:hover { background-color: #218838; }
        .back-link { color: #888; text-decoration: none; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo"><img th:src="${siteLogoSmall}" alt="LN"> Ranobe Kingdom</a>
    </nav>

    <div class="form-container">
        <a th:href="@{${volume.product.path + '/edit'}}" class="back-link">← Hủy và quay lại</a>
        <h2>Đăng Chương Mới</h2>
        <p style="color: #aaa;">Bộ truyện: <strong style="color: #fff;" th:text="${volume.product.title}">Truyện</strong> | Tập: <strong style="color: #fff;" th:text="${volume.title}">Tập</strong></p>

        <form th:action="@{${volume.product.path + '/tap/' + volume.volumeId + '/' + volume.slug + '/add-chapter'}}" method="post">
            <div class="form-group">
                <label for="title">Tên Chương:</label>
                <input type="text" id="title" name="title" placeholder="Ví dụ: Chương 1: Khởi đầu mới" required>
            </div>

            <div class="form-group">
                <label for="context">Nội Dung Chương:</label>
                <textarea id="context" name="context" placeholder="Nhập nội dung truyện ở đây..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">🚀 Đăng Chương</button>
        </form>
    </div>

</body>
</html>
