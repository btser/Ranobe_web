<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="${siteLogoSmall}">
    <title>Thêm chương mới</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #121212; color: #e0e0e0; }
        .navbar { position: sticky; top: 0; z-index: 1000; background: #1e1e1e; padding: 15px 30px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
        .logo { font-size: 22px; font-weight: bold; color: #4da6ff; text-decoration: none; display: inline-flex; align-items: center; gap: 10px; }
        .logo img { width: 38px; height: 38px; border-radius: 10px; display: block; }
    </style>
</head>
<body>
<nav class="navbar"><a href="/" class="logo"><img th:src="${siteLogoSmall}" alt="LN"> Ranobe Kingdom</a></nav>
<th:block th:replace="~{chapter-form :: form(
    ${volume.product.path + '/tap/' + volume.volumeId + '/' + volume.slug + '/add-chapter'},
    ${volume.product.productId}, '', true, '', 'Thêm chương', 'Thêm chương mới',
    ${volume.product.path + '/edit'})}"></th:block>
</body>
</html>
