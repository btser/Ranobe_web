<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="${siteLogoSmall}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${chapter.title} + ' - ' + ${chapter.volume.product.title}">Đọc Truyện</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #1b1b1b; color: #e0e0e0; }
        .navbar { background: #1e1e1e; padding: 15px 30px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
        .logo { font-size: 22px; font-weight: bold; color: #4da6ff; text-decoration: none; }
        .logo { display: inline-flex; align-items: center; gap: 10px; }
        .logo img { width: 38px; height: 38px; border-radius: 10px; display: block; }

        .reader { max-width: 1170px; margin: 0 auto; padding: 30px 16px 60px; background: #222; min-height: 100vh; box-sizing: border-box; }
        .head { text-align: center; margin-bottom: 40px; }
        .head .novel { font-size: 24px; font-weight: 700; color: #fff; text-decoration: none; display: inline-block; }
        .head .novel:hover { color: #4da6ff; }
        .head .chap { font-size: 18px; font-weight: 700; color: #f0f0f0; margin-top: 4px; }
        .wip { font-size: 12px; font-weight: 600; color: #ffb86b; border: 1px solid #ffb86b; border-radius: 10px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; }
        .content blockquote { margin: 0 0 1.1em; padding: 8px 16px; border-left: 3px solid #4da6ff; background: #1f2733; color: #b9c4dc; }
        .head .meta { font-size: 14px; font-weight: 600; color: #ddd; margin-top: 6px; }

        .content { max-width: 1166px; margin: 0 auto; font-family: 'Noto Serif', 'Times New Roman', Georgia, serif; font-size: 18px;
                   line-height: 1.7; color: #d4d4d4; text-align: justify; }
        .content p { margin: 0 0 1.1em; white-space: pre-line; word-wrap: break-word; }
        .content img { display: block; max-width: 100%; margin: 1.4em auto; border-radius: 4px; }

        .pager { display: flex; align-items: center; justify-content: space-between; border: 1px solid #555; border-radius: 40px;
                 padding: 10px 40px; margin: 40px 0 0; }
        .pager a, .pager span { display: flex; align-items: center; justify-content: center; width: 80px; height: 32px; color: #bbb; text-decoration: none; }
        .pager a:hover { color: #4da6ff; }
        .pager .off { color: #444; cursor: default; }
        .pager svg { width: 26px; height: 26px; fill: currentColor; }

        @media (max-width: 600px) { .content { font-size: 17px; } .pager { padding: 8px 16px; } }
    </style>
</head>
<body>
<nav class="navbar"><a href="/" class="logo"><img th:src="${siteLogoSmall}" alt="LN"> Ranobe Kingdom</a></nav>

<div class="reader">
    <div class="head">
        <a class="novel" th:href="@{${chapter.volume.product.path}}" th:text="${chapter.volume.product.title}">Tên truyện</a>
        <div class="chap"><span th:text="${chapter.title}">Chương 1</span>
            <span class="wip" th:unless="${chapter.completed}">Chưa hoàn thành</span></div>
        <div class="meta">
            <span th:if="${!#strings.isEmpty(chapter.volume.title)}" th:text="${chapter.volume.title} + ' - '">Tập 1 - </span>Độ dài: <span th:text="${#numbers.formatInteger(wordCount, 1, 'COMMA')}">0</span> từ
        </div>
    </div>

    <!-- Ảnh gắn riêng cho chương (ví dụ chương Minh họa) -->
    <div class="content" th:if="${images != null and !#lists.isEmpty(images)}">
        <img th:each="img : ${images}" th:src="${img.imageUrl}" alt="Ảnh minh họa"/>
    </div>

    <!-- Nội dung: chữ và ảnh xen kẽ đúng vị trí -->
    <div class="content" th:if="${contentHtml != null}" th:utext="${contentHtml}"></div>
    <div class="content" th:if="${contentHtml == null}">
        <th:block th:each="b : ${blocks}">
            <img th:if="${b.image}" th:src="${b.value}" alt="Ảnh minh họa"/>
            <p th:unless="${b.image}" th:text="${b.value}"></p>
        </th:block>
    </div>

    <div class="pager">
        <a th:href="@{'/truyen/' + ${chapter.volume.product.productId} + '/chuong/' + ${chapter.chapterId} + '/prev'}" title="Chương trước">
            <svg viewBox="0 0 24 24"><path d="M11 6v12l-8.5-6zM21 6v12l-8.5-6z"/></svg></a>
        <a th:href="@{${chapter.volume.product.path}}" title="Về trang truyện">
            <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg></a>
        <a th:href="@{'/truyen/' + ${chapter.volume.product.productId} + '/chuong/' + ${chapter.chapterId} + '/next'}" title="Chương sau">
            <svg viewBox="0 0 24 24"><path d="M13 6v12l8.5-6zM3 6v12l8.5-6z"/></svg></a>
    </div>
</div>
</body>
</html>
