<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đọc Truyện</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #121212; color: #e0e0e0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #1e1e1e; padding: 15px 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .logo { font-size: 22px; font-weight: bold; color: #4da6ff; text-decoration: none; }

        .reader-container { max-width: 800px; margin: 40px auto; padding: 30px; background: #1e1e1e; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        .back-link { color: #888; text-decoration: none; display: inline-block; margin-bottom: 20px; }
        .chapter-content { font-size: 18px; line-height: 1.8; color: #dcdcdc; white-space: pre-wrap; margin-top: 20px; word-wrap: break-word; }
        .chapter-images { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; }
        .chapter-images img { width: 100%; border-radius: 6px; display: block; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">📚 Ranobe Kingdom</a>
    </nav>

    <div class="reader-container">
        <a th:href="@{'/products/' + ${chapter.volume.product.productId}}" class="back-link">← Quay lại danh sách tập</a>

        <h1 th:text="${chapter.volume.product.title}">Tên Truyện</h1>
        <h3 style="color: #ffca28;" th:text="'Volume ID: ' + ${chapter.volume.volumeId}">Volume</h3>

        <hr style="border-color: #333;">

        <!-- ẢNH MINH HỌA (nếu có) -->
        <div class="chapter-images" th:if="${images != null and !#lists.isEmpty(images)}">
            <img th:each="img : ${images}" th:src="${img.imageUrl}" alt="Ảnh minh họa"/>
        </div>

        <!-- NỘI DUNG CHAPTER -->
        <div class="chapter-content" th:text="${chapter.context}">
            Nội dung bài viết sẽ hiển thị ở đây...
        </div>
    </div>

</body>
</html>
