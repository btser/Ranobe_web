<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="${siteLogoSmall}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${chapter.title} + ' - ' + ${chapter.volume.product.title}">Đọc truyện</title>
    <link rel="stylesheet" th:href="@{/css/reader.css}">
    <script th:src="@{/js/reading-storage.js}"></script>
    <script defer th:src="@{/js/reader.js}"></script>
</head>
<body>
<nav class="reader-navbar"><a href="/" class="reader-logo"><img th:src="${siteLogoSmall}" alt="">Ranobe Kingdom</a></nav>
<main class="reader" id="reader" th:attr="data-product-id=${chapter.volume.product.productId},data-chapter-id=${chapter.chapterId}">
    <header class="reader-head">
        <a class="novel" th:href="@{${chapter.volume.product.path}}" th:text="${chapter.volume.product.title}">Tên truyện</a>
        <h1 th:text="${chapter.title}">Tên chương</h1>
        <div class="meta"><span th:if="${!#strings.isEmpty(chapter.volume.title)}" th:text="${chapter.volume.title} + ' · '"></span><span th:text="${#numbers.formatInteger(wordCount, 1, 'COMMA')}">0</span> từ</div>
        <span class="wip" th:unless="${chapter.completed}">Chưa hoàn thành</span>
        <p id="readingNotice" class="reader-notice" role="status" hidden></p>
    </header>
    <article class="reader-content" id="readerContent" aria-label="Nội dung chương">
        <div th:if="${images != null and !#lists.isEmpty(images)}">
            <img th:each="img : ${images}" th:src="${img.imageUrl}" alt="Ảnh minh họa">
        </div>
        <div th:if="${contentHtml != null}" th:utext="${contentHtml}"></div>
        <div th:if="${contentHtml == null}">
            <th:block th:each="b : ${blocks}">
                <img th:if="${b.image}" th:src="${b.value}" alt="Ảnh minh họa">
                <p th:unless="${b.image}" th:text="${b.value}"></p>
            </th:block>
        </div>
    </article>
    <div class="reader-end" th:if="${readingNavigation.next == null}">Bạn đã đọc đến chương cuối hiện có.</div>
</main>
<nav class="reader-dock" aria-label="Điều hướng đọc truyện">
    <div class="read-progress" role="progressbar" aria-label="Tiến độ chương" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="readProgress"></span></div>
    <div class="reader-dock-inner">
        <a th:if="${readingNavigation.previous != null}" th:href="@{${readingNavigation.previous.path}}" class="reader-control" title="Chương trước"><span class="symbol" aria-hidden="true">←</span><span>Chương trước</span></a>
        <span th:if="${readingNavigation.previous == null}" class="reader-control" aria-disabled="true"><span class="symbol" aria-hidden="true">←</span><span>Chương trước</span></span>
        <button type="button" class="reader-control" data-open-dialog="readerToc" aria-haspopup="dialog" aria-label="Mục lục" title="Mục lục"><span class="symbol" aria-hidden="true">☰</span><span>Mục lục</span></button>
        <button type="button" class="reader-control" data-open-dialog="readerSettings" aria-haspopup="dialog" aria-label="Tùy chỉnh trang đọc" title="Tùy chỉnh trang đọc"><span class="symbol" aria-hidden="true">Aa</span><span>Tùy chỉnh</span></button>
        <a th:if="${readingNavigation.next != null}" th:href="@{${readingNavigation.next.path}}" class="reader-control" title="Chương sau"><span class="symbol" aria-hidden="true">→</span><span>Chương sau</span></a>
        <span th:if="${readingNavigation.next == null}" class="reader-control" aria-disabled="true"><span class="symbol" aria-hidden="true">→</span><span>Chương sau</span></span>
    </div>
</nav>
<dialog id="readerSettings" class="reader-dialog" aria-labelledby="settingsHeading">
    <header class="dialog-head"><h2 id="settingsHeading">Tùy chỉnh</h2><button type="button" class="close-dialog" data-close-dialog aria-label="Đóng">×</button></header>
    <div class="dialog-body">
        <label class="reader-setting"><span class="setting-label"><span>Cỡ chữ</span><output id="fontSizeValue">20 px</output></span><input id="fontSize" type="range" min="14" max="30" step="1" value="20"></label>
        <label class="reader-setting"><span class="setting-label"><span>Giãn dòng</span><output id="lineHeightValue">1.8</output></span><input id="lineHeight" type="range" min="1.4" max="2.4" step="0.1" value="1.8"></label>
        <div class="reader-setting"><span class="setting-label">Màu nền</span><div class="theme-options" role="group" aria-label="Màu nền">
            <button type="button" class="theme-swatch" data-theme="dark" aria-label="Nền tối" title="Nền tối" aria-pressed="true"></button>
            <button type="button" class="theme-swatch" data-theme="light" aria-label="Nền sáng" title="Nền sáng" aria-pressed="false"></button>
            <button type="button" class="theme-swatch" data-theme="warm" aria-label="Nền giấy" title="Nền giấy" aria-pressed="false"></button>
        </div></div>
        <button type="button" id="resetReader" class="reset-reader">Khôi phục mặc định</button>
    </div>
</dialog>
<dialog id="readerToc" class="reader-dialog" aria-labelledby="tocHeading">
    <header class="dialog-head"><h2 id="tocHeading">Mục lục</h2><button type="button" class="close-dialog" data-close-dialog aria-label="Đóng">×</button></header>
    <div class="dialog-body">
        <label><span hidden>Tìm chương</span><input id="tocSearch" class="toc-search" type="search" placeholder="Tìm chương hoặc tập…" aria-label="Tìm chương hoặc tập"></label>
        <ul class="toc-list">
            <li th:each="link : ${readingNavigation.chapters}">
                <a th:href="@{${link.path}}" th:attr="data-chapter-id=${link.chapterId},aria-current=${link.chapterId == chapter.chapterId ? 'page' : null}">
                    <small th:text="${link.volumeTitle}"></small><span th:text="${link.title}"></span>
                </a>
            </li>
        </ul>
        <p id="tocEmpty" class="reader-notice" hidden>Không tìm thấy chương.</p>
    </div>
</dialog>
</body>
</html>
