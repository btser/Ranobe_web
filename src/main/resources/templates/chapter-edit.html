<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa Chương</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #121212; color: #e0e0e0; }
        .navbar { background-color: #1e1e1e; padding: 15px 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .logo { font-size: 22px; font-weight: bold; color: #4da6ff; text-decoration: none; }
        .form-container { max-width: 800px; margin: 40px auto; padding: 30px; background: #1e1e1e; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { color: #ffca28; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #ffca28; }
        input[type="text"], textarea { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; color: #fff; box-sizing: border-box; font-size: 15px; }
        textarea { height: 350px; line-height: 1.6; resize: vertical; }
        .btn-submit { background-color: #4da6ff; color: white; border: none; padding: 12px 20px; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-submit:hover { background-color: #2d8fe8; }
        .back-link { color: #888; text-decoration: none; display: inline-block; margin-bottom: 15px; }

        .notice { border-radius: 5px; padding: 10px 12px; margin: 12px 0; font-weight: bold; }
        .notice.success { background: rgba(40,167,69,0.14); color: #65d17c; border: 1px solid rgba(40,167,69,0.35); }
        .notice.error { background: rgba(220,53,69,0.14); color: #ff7b88; border: 1px solid rgba(220,53,69,0.35); }
        .image-section { margin-top: 10px; padding-top: 20px; border-top: 1px solid #333; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
        .image-card { position: relative; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; overflow: hidden; cursor: grab; }
        .image-card img { width: 100%; height: 140px; object-fit: cover; display: block; }
        .image-card .order-badge { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.7); color: #ffca28; font-size: 12px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        .image-card .delete-form { position: absolute; top: 4px; right: 4px; }
        .image-card .btn-delete-img { background: rgba(220,53,69,0.85); color: #fff; border: none; border-radius: 4px; padding: 3px 7px; cursor: pointer; font-size: 12px; }
        .image-card .btn-delete-img:hover { background: #dc3545; }
        .image-card.dragging { opacity: 0.4; }
        .no-images { color: #888; font-style: italic; margin-bottom: 15px; }
        .upload-form { display: grid; gap: 12px; }
        .upload-drop { border: 2px dashed #4da6ff; border-radius: 8px; padding: 22px; text-align: center; background: rgba(77,166,255,0.05); cursor: pointer; }
        .upload-drop:hover { background: rgba(77,166,255,0.09); }
        .upload-drop strong { color: #4da6ff; display: block; margin-bottom: 5px; }
        .upload-drop span { color: #aaa; font-size: 14px; }
        .upload-form input[type="file"] { display: none; }
        .preview-grid { display: none; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
        .preview-grid.show { display: grid; }
        .preview-item { background: #252525; border: 1px solid #444; border-radius: 6px; overflow: hidden; }
        .preview-item img { width: 100%; height: 110px; object-fit: cover; display: block; }
        .preview-name { padding: 6px; color: #ccc; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .upload-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .selected-count { color: #aaa; font-size: 14px; }
        .btn-upload { background-color: #28a745; color: white; border: none; padding: 10px 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-upload:hover { background-color: #218838; }
        .btn-upload:disabled { background: #444; cursor: not-allowed; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">📚 Ranobe Kingdom</a>
    </nav>

    <div class="form-container">
        <a th:href="@{'/products/' + ${chapter.volume.product.productId} + '/edit'}" class="back-link">← Hủy và quay lại</a>
        <h2>Sửa Chương</h2>
        <p style="color: #aaa;">
            Bộ truyện: <strong style="color: #fff;" th:text="${chapter.volume.product.title}">Truyện</strong>
            | Tập: <strong style="color: #fff;" th:text="${!#strings.isEmpty(chapter.volume.title) ? chapter.volume.title : '—'}">Tập</strong>
        </p>

        <form th:action="@{'/products/chapter/' + ${chapter.chapterId} + '/edit'}" method="post">
            <div class="form-group">
                <label for="title">Tên Chương:</label>
                <input type="text" id="title" name="title" th:value="${chapter.title}" required>
            </div>

            <div class="form-group">
                <label for="context">Nội Dung Chương:</label>
                <textarea id="context" name="context" required th:text="${chapter.context}"></textarea>
            </div>

            <button type="submit" class="btn-submit">💾 Lưu thay đổi</button>
        </form>

        <div class="image-section">
            <h3 style="color:#ffca28; margin-bottom: 10px;">🖼 Ảnh minh họa trong chương</h3>

            <div class="notice success" th:if="${param.uploaded}" th:text="'Đã thêm ' + ${param.uploaded[0]} + ' ảnh vào chương.'"></div>
            <div class="notice error" th:if="${param.uploadError}">Có ảnh chưa upload được. Hãy thử lại với file JPG, PNG, WEBP hoặc GIF.</div>

            <div class="image-grid" id="imageGrid" th:attr="data-chapter-id=${chapter.chapterId}">
                <div th:each="img, imgStat : ${images}" class="image-card" th:attr="data-image-id=${img.imageId}" draggable="true">
                    <span class="order-badge" th:text="${imgStat.count}">1</span>
                    <img th:src="${img.imageUrl}" alt="Ảnh chương"/>
                    <form class="delete-form" th:action="@{'/products/chapter/image/' + ${img.imageId} + '/delete'}"
                          method="post" onsubmit="return confirm('Xóa ảnh này?');">
                        <button type="submit" class="btn-delete-img">🗑</button>
                    </form>
                </div>
            </div>

            <div class="no-images" th:if="${images == null or #lists.isEmpty(images)}">
                Chương này chưa có ảnh minh họa nào. Kéo thả các ảnh bên trên để đổi thứ tự sau khi thêm.
            </div>

            <form class="upload-form" th:action="@{'/products/chapter/' + ${chapter.chapterId} + '/images'}"
                  method="post" enctype="multipart/form-data">
                <label class="upload-drop" for="imageFiles">
                    <strong>Chọn ảnh minh họa</strong>
                    <span>Có thể chọn nhiều ảnh cùng lúc. Sau khi thêm, kéo thả các ảnh phía trên để đổi thứ tự.</span>
                </label>
                <input id="imageFiles" type="file" name="imageFiles" accept="image/*" multiple required>
                <div class="preview-grid" id="previewGrid"></div>
                <div class="upload-actions">
                    <span class="selected-count" id="selectedCount">Chưa chọn ảnh nào</span>
                    <button type="submit" class="btn-upload" id="uploadBtn" disabled>+ Thêm ảnh đã chọn</button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        const chapterId = /*[[${chapter.chapterId}]]*/ 0;
        const grid = document.getElementById('imageGrid');
        let draggedCard = null;

        if (grid) {
            grid.querySelectorAll('.image-card').forEach(card => {
                card.addEventListener('dragstart', () => {
                    draggedCard = card;
                    card.classList.add('dragging');
                });
                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    draggedCard = null;
                    saveImageOrder();
                });
                card.addEventListener('dragover', e => {
                    e.preventDefault();
                    if (!draggedCard || draggedCard === card) return;
                    const rect = card.getBoundingClientRect();
                    const after = (e.clientX - rect.left) > rect.width / 2;
                    grid.insertBefore(draggedCard, after ? card.nextSibling : card);
                });
            });
        }

        const fileInput = document.getElementById('imageFiles');
        const previewGrid = document.getElementById('previewGrid');
        const selectedCount = document.getElementById('selectedCount');
        const uploadBtn = document.getElementById('uploadBtn');

        if (fileInput) {
            fileInput.addEventListener('change', () => {
                previewGrid.innerHTML = '';
                const files = [...fileInput.files];
                previewGrid.classList.toggle('show', files.length > 0);
                selectedCount.textContent = files.length > 0 ? `Đã chọn ${files.length} ảnh` : 'Chưa chọn ảnh nào';
                uploadBtn.disabled = files.length === 0;

                files.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'preview-item';

                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    img.onload = () => URL.revokeObjectURL(img.src);

                    const name = document.createElement('div');
                    name.className = 'preview-name';
                    name.textContent = file.name;

                    item.appendChild(img);
                    item.appendChild(name);
                    previewGrid.appendChild(item);
                });
            });
        }

        function saveImageOrder() {
            const ids = [...grid.querySelectorAll('.image-card')]
                .map(c => parseInt(c.dataset.imageId, 10));

            fetch(`/products/chapter/${chapterId}/images/reorder`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(ids)
            }).then(() => location.reload()).catch(() => {});
        }
    </script>

</body>
</html>
