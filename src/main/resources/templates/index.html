<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" th:href="${siteLogoSmall}">
    <title>Trang Chủ</title>
    <link rel="stylesheet" th:href="@{/css/catalog.css}">
</head>
<body>

    <!-- NAVBAR HEADER -->
    <nav class="navbar" th:fragment="navigation">
        <a href="/" class="logo"><img th:src="${siteLogoSmall}" alt="LN"> Ranobe Kingdom</a>
        
        <div class="nav-links">
            <a href="/xep-hang" class="advanced-link">Xếp hạng</a>
            <!-- Nút hiển thị khi CHƯA đăng nhập -->
            <th:block th:if="${user == null}">
                <a href="/login" class="btn btn-login">Đăng Nhập</a>
                <a href="/register" class="btn btn-register">Đăng Ký</a>
            </th:block>

            <!-- Nút hiển thị khi ĐÃ đăng nhập -->
            <th:block th:if="${user != null}">
                <span>Xin chào, <a th:href="@{'/users/' + ${user.userId}}" class="user-name" style="text-decoration:none;" th:text="${user.userName}">Admin</a>!</span>
                
                <a th:if="${isStaff}" href="/admin" class="btn btn-login">整理</a>
                <a href="/truyen/add" class="btn btn-add">+ Đăng Truyện</a>
                <a href="/logout" class="btn btn-logout">Đăng Xuất</a>
            </th:block>
        </div>
    </nav>

    <!-- CONTENT MAIN -->
    <div class="container">
        <div class="section-head">
            <div class="section-titles">
                <span class="pill">Truyện dịch</span>
                <span class="label">Mới cập nhật</span>
            </div>
            <div class="quick-search-wrap">
                <form class="quick-search" method="get" action="/" role="search">
                    <input type="search" name="q" th:value="${q}" maxlength="150"
                           placeholder="Tìm theo tên truyện…" aria-label="Tìm theo tên truyện">
                    <button type="submit" title="Tìm truyện" aria-label="Tìm truyện">⌕</button>
                </form>
                <a class="advanced-link" th:href="@{/tim-kiem(q=${q})}">Tìm kiếm nâng cao →</a>
            </div>
        </div>

        <p class="catalog-count" th:text="${results.totalElements} + ' truyện'">0 truyện</p>

        <div class="grid-container" th:fragment="resultsGrid">
            <a th:each="product : ${products}"
               th:with="lc=${latestChapters[product.productId]}"
               th:href="@{${product.path}}" class="novel-card">

                <div class="cover">
                    <img th:src="${#strings.isEmpty(product.coverImage)} ? ${siteDefaultCover} : ${product.coverImage}"
                         th:data-fallback="${siteDefaultCover}" onerror="this.onerror=null;this.src=this.dataset.fallback"
                         loading="lazy" alt="Ảnh bìa"/>

                    <span class="badge-hidden" th:if="${product.status != null and product.status.name() != 'PUBLIC'}"
                          th:text="${product.status}">HIDDEN</span>

                    <div class="cover-info">
                        <div class="chap" th:if="${lc != null}"
                             th:text="${!#strings.isEmpty(lc.title) ? lc.title : 'Chương mới'}">Chương 1</div>
                        <div class="vol" th:if="${lc != null}"
                             th:text="${!#strings.isEmpty(lc.volume.title) ? lc.volume.title : 'Tập ' + (lc.volume.sortOrder + 1)}">Tập 1</div>
                        <div class="vol" th:if="${lc == null}" style="color:#aaa;">Chưa có chương</div>
                    </div>
                </div>

                <div class="name" th:text="${product.title}">Tên truyện</div>
            </a>
        </div>

        <div th:if="${#lists.isEmpty(products)}">
            <p>Không có truyện phù hợp.</p>
        </div>
        <nav class="catalog-pages" th:fragment="pagination" aria-label="Phân trang" th:if="${results.totalPages > 1}">
            <a th:if="${results.hasPrevious()}" th:href="${advancedSearch} ? @{/tim-kiem(q=${q},author=${author},artist=${artist},uploader=${uploader},categoryId=${categoryId},sort=${sort},page=${results.number - 1})} : @{/(q=${q},page=${results.number - 1})}" aria-label="Trang trước">←</a>
            <span th:text="'Trang ' + ${results.number + 1} + ' / ' + ${results.totalPages}"></span>
            <a th:if="${results.hasNext()}" th:href="${advancedSearch} ? @{/tim-kiem(q=${q},author=${author},artist=${artist},uploader=${uploader},categoryId=${categoryId},sort=${sort},page=${results.number + 1})} : @{/(q=${q},page=${results.number + 1})}" aria-label="Trang sau">→</a>
        </nav>
    </div>

</body>
</html>
