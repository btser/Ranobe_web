<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang Chủ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #121212; color: #e0e0e0; }
        
        /* Navbar Header */
        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #1e1e1e; padding: 15px 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .logo { font-size: 22px; font-weight: bold; color: #4da6ff; text-decoration: none; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        
        .btn { padding: 8px 16px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .btn-login { background-color: transparent; border: 1px solid #4da6ff; color: #4da6ff; }
        .btn-login:hover { background-color: #4da6ff; color: white; }
        .btn-register { background-color: #28a745; color: white; }
        .btn-register:hover { background-color: #218838; }
        .btn-add { background-color: #007bff; color: white; }
        .btn-add:hover { background-color: #0056b3; }
        .btn-logout { background-color: #dc3545; color: white; }
        .btn-logout:hover { background-color: #c82333; }
        .user-name { color: #ffca28; font-weight: bold; }

        /* Content Container */
        .container { padding: 30px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-left: 5px solid #4da6ff; }
        .card h3 { margin-top: 0; color: #4da6ff; }
        .tag { background-color: #28a745; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <!-- NAVBAR HEADER -->
    <nav class="navbar">
        <a href="/" class="logo">📚 Ranobe Kingdom</a>
        
        <div class="nav-links">
            <!-- Nút hiển thị khi CHƯA đăng nhập -->
            <th:block th:if="${user == null}">
                <a href="/login" class="btn btn-login">Đăng Nhập</a>
                <a href="/register" class="btn btn-register">Đăng Ký</a>
            </th:block>

            <!-- Nút hiển thị khi ĐÃ đăng nhập -->
            <th:block th:if="${user != null}">
                <span>Xin chào, <span class="user-name" th:text="${user.userName}">Admin</span>!</span>
                <a th:if="${isStaff}" href="/admin" class="btn btn-login">Quản trị</a>
                <a href="/products/add" class="btn btn-add">+ Đăng Truyện</a>
                <a href="/logout" class="btn btn-logout">Đăng Xuất</a>
            </th:block>
        </div>
    </nav>

    <!-- CONTENT MAIN -->
    <div class="container">
        <h1>Danh Sách Truyện</h1>

        <div class="grid-container">
            <div th:each="product : ${products}" class="card">
                <img th:if="${product.coverImage != null}"
                    th:src="${product.coverImage}"
                    alt="Ảnh bìa"
                    style="width:100%; height:180px; object-fit:cover; border-radius:6px; margin-bottom:10px;"/>
                <h3>
                    <a  th:href="@{'/products/' + ${product.productId}}"
                        th:text="${product.title}"
                        style="color:#4da6ff; text-decoration: none;" > Tên truyện</a>
                </h3>
                <p><strong>Author:</strong> <span th:text="${!#strings.isEmpty(product.author) ? product.author : 'Chưa cập nhật'}">Tác giả</span></p>
                <p><strong>Artist:</strong> <span th:text="${!#strings.isEmpty(product.artist) ? product.artist : 'Chưa cập nhật'}">Họa sĩ</span></p>
                <p><strong>Trạng thái:</strong> 
                    <span class="tag" th:text="${product.status}">PUBLIC</span>
                </p>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(products)}">
            <p>Empty</p>
        </div>
    </div>

</body>
</html>
