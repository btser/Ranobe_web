<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Lalobe</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #121212; color: #e0e0e0; }
        .login-card { max-width: 400px; margin: 50px auto; background: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-top: 4px solid #4da6ff; }
        h2 { text-align: center; color: #4da6ff; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .error-msg { color: #ff4d4d; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Login</h2>
        
        <!-- Notify if wrong username or password -->
        <div th:if="${error}" class="error-msg" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Username:</label>
                <input type="text" name="username" required placeholder="Enter your username..."/>
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" required placeholder="Enter your password..."/>
            </div>

            <button type="submit">Login</button>
            <a href="/register" class="link">Register</a>
        </form>
    </div>

</body>
</html>
