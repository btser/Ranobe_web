<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Truyện Mới</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #121212; color: #e0e0e0; }
        .form-container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-top: 4px solid #4da6ff; }
        h2 { margin-top: 0; color: #4da6ff; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #888; text-decoration: none; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Đăng Truyện Mới</h2>
        <form th:action="@{/products/add}" th:object="${product}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>Ảnh Bìa:</label>
                <input type="file" name="imageFile" accept="image/*"/>
            </div>
            
            <div class="form-group">
                <label>Tên Truyện:</label>
                <input type="text" th:field="*{title}" required placeholder="Nhập tên truyện..."/>
            </div>

            <div class="form-group">
                <label>Tác Giả:</label>
                <input type="text" th:field="*{author}" required placeholder="Nhập tên tác giả..."/>
            </div>

            <div class="form-group">
                <label>Họa Sĩ:</label>
                <input type="text" th:field="*{artist}" placeholder="Nhập tên họa sĩ..."/>
            </div>

            <div class="form-group">
                <label>Thể Loại:</label>
                <select name="categoryId" required>
                    <option value="" disabled selected>-- Chọn thể loại --</option>
                    <option th:each="cat : ${categories}" 
                            th:value="${cat.categoryId}" 
                            th:text="${cat.categoryName}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Trạng Thái:</label>
                <select th:field="*{status}">
                    <option th:each="st : ${statuses}" 
                            th:value="${st}" 
                            th:text="${st}"></option>
                </select>
            </div>

            <button type="submit">Lưu Truyện</button>
            <a href="/" class="back-link">← Quay lại trang chủ</a>
        </form>
    </div>

</body>
</html>
