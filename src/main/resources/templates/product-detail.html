<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product?.title != null ? product.title : 'Chi Tiết Truyện'}">
        Chi Tiết Truyện
    </title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #121212; color: #e0e0e0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #1e1e1e; padding: 15px 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .logo { font-size: 22px; font-weight: bold; color: #4da6ff; text-decoration: none; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .detail-card { background: #1e1e1e; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-top: 4px solid #4da6ff; margin-bottom: 30px; }
        .detail-card h1 { color: #4da6ff; margin-top: 0; }
        .info-group { margin-bottom: 10px; font-size: 16px; }
        .tag { background-color: #28a745; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .volume-box { background: #1a1a1a; border: 1px solid #333; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
        .volume-title { color: #ffca28; font-weight: bold; font-size: 18px; }
        .back-link { color: #888; text-decoration: none; display: inline-block; margin-bottom: 15px; }

        .owner-actions { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .btn-edit { background-color: #4da6ff; color: white; border: none; padding: 9px 14px; border-radius: 5px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-edit:hover { background-color: #2d8fe8; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="logo">📚 Ranobe Kingdom</a>
</nav>

<div class="container">

    <a href="/" class="back-link">← Quay lại trang chủ</a>

    <!-- NÚT SANG TRANG EDIT - CHỈ OWNER THẤY -->
    <div class="owner-actions" th:if="${canManage}">
        <a th:href="@{'/products/' + ${product.productId} + '/edit'}" class="btn-edit">
            ✏️ Chỉnh sửa
        </a>
    </div>

    <!-- THÔNG TIN TRUYỆN -->
    <div class="detail-card">
        <img th:if="${product?.coverImage != null}"
            th:src="${product.coverImage}"
            alt="Ảnh bìa"
            style="width:100%; max-height:320px; object-fit:cover; border-radius:6px; margin-bottom:15px;"/>
        <h1 th:text="${product?.title}">Tên Truyện</h1>

        <div class="info-group">
            <strong>Tác giả:</strong>
            <span th:text="${product?.author}">-</span>
        </div>

        <div class="info-group">
            <strong>Họa sĩ:</strong>
            <span th:text="${product?.artist}">-</span>
        </div>

        <div class="info-group">
            <strong>Thể loại:</strong>
            <span th:text="${product?.category?.categoryName != null
                    ? product.category.categoryName
                    : 'Chưa phân loại'}">-</span>
        </div>

        <div class="info-group">
            <strong>Người đăng:</strong>
            <span th:text="${product?.uploader?.userName != null
                    ? product.uploader.userName
                    : 'Ẩn danh'}">-</span>
        </div>

        <div class="info-group">
            <strong>Trạng thái:</strong>
            <span class="tag" th:text="${product?.status}">PUBLIC</span>
        </div>
    </div>

    <!-- DANH SÁCH VOLUME -->
    <div class="section-header">
        <h2>Danh Sách Tập</h2>
    </div>

    <div th:each="vol, iterStat : ${volumes}" class="volume-box">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px;">
            <img th:if="${vol.coverImage != null}" th:src="${vol.coverImage}" alt="Bìa tập"
                style="width:44px; height:60px; object-fit:cover; border-radius:4px; flex-shrink:0;"/>
            <span class="volume-title"
                  th:text="${!#strings.isEmpty(vol.title) ? vol.title : 'Tập ' + iterStat.count}">
                Tập 1
            </span>
        </div>

        <ul style="list-style: none; padding-left: 0; margin: 0;">
            <li th:each="chap, chapStat : ${vol?.chapters}" style="margin-bottom: 10px;">
                📄
                <a th:href="@{'/products/chapter/' + ${chap.chapterId}}"
                   th:text="${!#strings.isEmpty(chap.title) ? chap.title : 'Chương ' + chapStat.count}"
                   style="color: #4da6ff; text-decoration: none; font-weight: bold; font-size: 15px;">
                    Chương 1
                </a>
            </li>
        </ul>

        <div th:if="${vol?.chapters == null or #lists.isEmpty(vol.chapters)}"
             style="color: #aaa; font-style: italic; margin-top: 5px;">
            Chưa có chapter nào trong tập này.
        </div>
    </div>

    <div th:if="${volumes == null or #lists.isEmpty(volumes)}"
         style="color: #888; font-style: italic; text-align: center; margin-top: 20px;">
        Bộ truyện này chưa có Volume nào.
    </div>

</div>

</body>
</html>
