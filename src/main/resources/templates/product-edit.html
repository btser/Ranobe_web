<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Chỉnh sửa - ' + (${product?.title} != null ? product.title : '')">Chỉnh Sửa Truyện</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #121212; color: #e0e0e0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #1e1e1e; padding: 15px 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .logo { font-size: 22px; font-weight: bold; color: #4da6ff; text-decoration: none; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .back-link { color: #888; text-decoration: none; }
        .btn-view { background-color: transparent; border: 1px solid #4da6ff; color: #4da6ff; padding: 8px 14px; border-radius: 5px; font-weight: bold; text-decoration: none; }
        .btn-view:hover { background-color: #4da6ff; color: white; }

        .tabs { display: flex; gap: 25px; border-bottom: 1px solid #333; margin-bottom: 20px; }
        .tab-btn { background: none; border: none; color: #aaa; font-size: 16px; font-weight: bold; padding: 10px 2px; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: #ff5c5c; border-bottom-color: #ff5c5c; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .card { background: #1e1e1e; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-top: 4px solid #ffca28; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #ccc; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        .btn-save-info { background-color: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-save-info:hover { background-color: #218838; }

        .dashed-box { border: 2px dashed #4da6ff; border-radius: 8px; padding: 16px; text-align: center; margin-bottom: 20px; cursor: pointer; color: #4da6ff; font-weight: bold; }
        .dashed-box:hover { background: rgba(77,166,255,0.08); }
        .inline-add-form { display: none; gap: 8px; margin-bottom: 20px; }
        .inline-add-form.show { display: flex; flex-wrap: wrap; }
        .title-input { background: #2a2a2a; border: 1px solid #444; border-radius: 4px; color: #fff; padding: 8px 10px; flex: 1; min-width: 220px; }
        .btn-add { background-color: #28a745; color: white; border: none; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-add:hover { background-color: #218838; }

        .volume-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
        .volume-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
        .drag-handle { cursor: grab; color: #777; font-size: 18px; user-select: none; }
        .volume-cover-thumb { width: 44px; height: 60px; object-fit: cover; border-radius: 4px; background: #2a2a2a; flex-shrink: 0; }
        .volume-cover-placeholder { display: flex; align-items: center; justify-content: center; color: #666; font-size: 18px; border: 1px dashed #444; }
        .volume-info { flex: 1; }
        .volume-info .v-title { font-weight: bold; font-size: 16px; }
        .volume-info .v-count { color: #888; font-size: 13px; }
        .icon-btn { background: none; border: none; color: #aaa; cursor: pointer; font-size: 16px; padding: 4px 6px; }
        .icon-btn:hover { color: #fff; }
        .icon-btn.danger:hover { color: #ff5c5c; }
        .chevron { transition: transform 0.2s; display: inline-block; }
        .volume-card.expanded .chevron { transform: rotate(180deg); }

        .volume-body { display: none; padding: 0 16px 16px; border-top: 1px solid #2a2a2a; }
        .volume-card.expanded .volume-body { display: block; }

        .rename-form { display: none; gap: 8px; padding: 0 16px 12px; }
        .rename-form.show { display: flex; }
        .cover-form { display: none; gap: 8px; padding: 0 16px 12px; align-items: center; flex-wrap: wrap; }
        .cover-form.show { display: flex; }

        .chapter-toolbar { display: flex; gap: 10px; margin: 14px 0 10px; flex-wrap: wrap; }
        .btn-toolbar { background: #2a2a2a; border: 1px solid #444; color: #ddd; padding: 7px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; }
        .btn-toolbar:hover { background: #333; }
        .btn-toolbar.active { border-color: #4da6ff; color: #4da6ff; }

        .chapter-search { width: 100%; padding: 8px 10px; margin-bottom: 10px; background: #2a2a2a; border: 1px solid #333; border-radius: 4px; color: #fff; }

        .chapter-list { list-style: none; padding: 0; margin: 0; }
        .chapter-item { display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-radius: 5px; }
        .chapter-item:hover { background: #232323; }
        .chapter-item .c-drag { display: none; cursor: grab; color: #777; }
        .chapter-item.sortable .c-drag { display: inline-block; }
        .chapter-item .c-title { flex: 1; color: #4da6ff; text-decoration: none; font-weight: bold; }
        .chapter-item.dragging { opacity: 0.4; }

        .empty-note { color: #888; font-style: italic; text-align: center; padding: 15px 0; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="logo">📚 Ranobe Kingdom</a>
</nav>

<div class="container">

    <div class="top-bar">
        <a th:href="@{'/products/' + ${product.productId}}" class="back-link">← Quay lại xem truyện</a>
        <a th:href="@{'/products/' + ${product.productId}}" class="btn-view">👁 Xem truyện</a>
    </div>

    <div class="tabs">
        <button type="button" class="tab-btn" data-tab="info">Thông tin</button>
        <button type="button" class="tab-btn active" data-tab="volumes">Danh sách Tập &amp; Chương</button>
    </div>

    <!-- ============== TAB: THÔNG TIN ============== -->
    <div class="tab-panel" id="tab-info">
        <div class="card">
            <form th:action="@{'/products/' + ${product.productId} + '/edit-info'}" method="post">
                <div class="form-group">
                    <label>Tên Truyện:</label>
                    <input type="text" name="title" th:value="${product.title}" required>
                </div>
                <div class="form-group">
                    <label>Tác Giả:</label>
                    <input type="text" name="author" th:value="${product.author}">
                </div>
                <div class="form-group">
                    <label>Họa Sĩ:</label>
                    <input type="text" name="artist" th:value="${product.artist}">
                </div>
                <div class="form-group">
                    <label>Thể Loại:</label>
                    <select name="categoryId">
                        <option th:each="cat : ${categories}"
                                th:value="${cat.categoryId}"
                                th:text="${cat.categoryName}"
                                th:selected="${product.category != null and product.category.categoryId == cat.categoryId}">
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Trạng Thái:</label>
                    <select name="status">
                        <option th:each="st : ${statuses}"
                                th:value="${st}"
                                th:text="${st}"
                                th:selected="${product.status == st}">
                        </option>
                    </select>
                </div>
                <button type="submit" class="btn-save-info">💾 Lưu thông tin</button>
            </form>
        </div>
    </div>

    <!-- ============== TAB: DANH SÁCH TẬP & CHƯƠNG ============== -->
    <div class="tab-panel active" id="tab-volumes">

        <div class="dashed-box" id="showAddVolumeBtn">+ Tạo tập mới</div>

        <form th:action="@{'/products/' + ${product.productId} + '/add-volume'}"
              method="post" class="inline-add-form" id="addVolumeForm">
            <input class="title-input" type="text" name="title" placeholder="Tên volume mới (để trống = Tập N)">
            <button type="submit" class="btn-add">Thêm</button>
        </form>

        <div id="volumeList">
            <div th:each="vol, iterStat : ${volumes}"
                 class="volume-card" th:attr="data-volume-id=${vol.volumeId}">

                <div class="volume-header">
                    <span class="drag-handle" title="Kéo để sắp xếp">⠿</span>

                    <img th:if="${vol.coverImage != null}" th:src="${vol.coverImage}" alt="Bìa tập" class="volume-cover-thumb"/>
                    <div th:if="${vol.coverImage == null}" class="volume-cover-thumb volume-cover-placeholder">🖼</div>

                    <div class="volume-info">
                        <div class="v-title"
                             th:text="${!#strings.isEmpty(vol.title) ? vol.title : 'Tập ' + iterStat.count}">Tập 1</div>
                        <div class="v-count" th:text="${#lists.size(vol.chapters)} + ' chương'">0 chương</div>
                    </div>

                    <button type="button" class="icon-btn cover-toggle" title="Đổi ảnh bìa tập">🖼️</button>
                    <button type="button" class="icon-btn rename-toggle" title="Sửa tên tập">✏️</button>

                    <form th:action="@{'/products/volume/' + ${vol.volumeId} + '/delete'}" method="post"
                          onsubmit="return confirm('Xóa tập này? Toàn bộ chương bên trong cũng sẽ bị ẩn.');" style="display:inline;">
                        <button type="submit" class="icon-btn danger" title="Xóa tập">🗑</button>
                    </form>

                    <button type="button" class="icon-btn expand-toggle" title="Xem chương">
                        <span class="chevron">▾</span>
                    </button>
                </div>

                <form th:action="@{'/products/volume/' + ${vol.volumeId} + '/cover'}"
                      method="post" enctype="multipart/form-data" class="cover-form">
                    <input type="file" name="coverFile" accept="image/*" class="title-input" required>
                    <button type="submit" class="btn-add">Lưu ảnh bìa</button>
                </form>

                <form th:action="@{'/products/volume/' + ${vol.volumeId} + '/edit-title'}"
                      method="post" class="rename-form">
                    <input class="title-input" type="text" name="title" th:value="${vol.title}"
                           th:placeholder="'Tập ' + ${iterStat.count}">
                    <button type="submit" class="btn-add">Lưu</button>
                </form>

                <div class="volume-body">

                    <div class="chapter-toolbar">
                        <a th:href="@{'/products/volume/' + ${vol.volumeId} + '/add-chapter'}"
                           class="btn-toolbar">+ Thêm chương mới</a>
                        <button type="button" class="btn-toolbar sort-toggle"
                                th:attr="data-volume-id=${vol.volumeId}">⇅ Sắp xếp chương</button>
                    </div>

                    <input type="text" class="chapter-search" placeholder="Tìm chương...">

                    <ul class="chapter-list" th:attr="data-volume-id=${vol.volumeId}">
                        <li th:each="chap, chapStat : ${vol?.chapters}" class="chapter-item"
                            th:attr="data-chapter-id=${chap.chapterId}">

                            <span class="c-drag">⠿</span>

                            <a th:href="@{'/products/chapter/' + ${chap.chapterId}}"
                               th:text="${!#strings.isEmpty(chap.title) ? chap.title : 'Chương ' + chapStat.count}"
                               class="c-title">Chương 1</a>

                            <a th:href="@{'/products/chapter/' + ${chap.chapterId} + '/edit'}"
                               class="icon-btn" title="Sửa nội dung">✏️</a>

                            <form th:action="@{'/products/chapter/' + ${chap.chapterId} + '/delete'}" method="post"
                                  onsubmit="return confirm('Xóa chương này?');" style="display:inline;">
                                <button type="submit" class="icon-btn danger" title="Xóa chương">🗑</button>
                            </form>
                        </li>
                    </ul>

                    <div class="empty-note" th:if="${vol?.chapters == null or #lists.isEmpty(vol.chapters)}">
                        Chưa có chapter nào trong tập này.
                    </div>
                </div>
            </div>
        </div>

        <div class="empty-note" th:if="${volumes == null or #lists.isEmpty(volumes)}">
            Bộ truyện này chưa có Volume nào.
        </div>
    </div>

</div>

<script th:inline="javascript">
    const productId = /*[[${product.productId}]]*/ 0;

    // ---------- TABS ----------
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        });
    });

    // ---------- TOGGLE FORM THÊM VOLUME ----------
    const showAddVolumeBtn = document.getElementById('showAddVolumeBtn');
    const addVolumeForm = document.getElementById('addVolumeForm');
    if (showAddVolumeBtn) {
        showAddVolumeBtn.addEventListener('click', () => {
            addVolumeForm.classList.toggle('show');
        });
    }

    // ---------- EXPAND / RENAME VOLUME ----------
    document.querySelectorAll('.volume-card').forEach(card => {
        const expandBtn = card.querySelector('.expand-toggle');
        expandBtn.addEventListener('click', () => card.classList.toggle('expanded'));

        const renameBtn = card.querySelector('.rename-toggle');
        const renameForm = card.querySelector('.rename-form');
        renameBtn.addEventListener('click', () => renameForm.classList.toggle('show'));

        const coverBtn = card.querySelector('.cover-toggle');
        const coverForm = card.querySelector('.cover-form');
        coverBtn.addEventListener('click', () => coverForm.classList.toggle('show'));
    });

    // ---------- SEARCH CHƯƠNG ----------
    document.querySelectorAll('.chapter-search').forEach(input => {
        input.addEventListener('input', () => {
            const keyword = input.value.trim().toLowerCase();
            const list = input.nextElementSibling; // ul.chapter-list
            list.querySelectorAll('.chapter-item').forEach(li => {
                const title = li.querySelector('.c-title').textContent.toLowerCase();
                li.style.display = title.includes(keyword) ? '' : 'none';
            });
        });
    });

    // ---------- KÉO THẢ SẮP XẾP VOLUME (luôn bật) ----------
    let draggedVolume = null;
    const volumeListEl = document.getElementById('volumeList');

    volumeListEl.querySelectorAll('.volume-card').forEach(card => {
        card.setAttribute('draggable', 'true');

        card.addEventListener('dragstart', () => {
            draggedVolume = card;
            card.classList.add('dragging');
        });
        card.addEventListener('dragend', () => {
            card.classList.remove('dragging');
            draggedVolume = null;
            saveVolumeOrder();
        });
        card.addEventListener('dragover', e => {
            e.preventDefault();
            if (!draggedVolume || draggedVolume === card) return;
            const rect = card.getBoundingClientRect();
            const after = (e.clientY - rect.top) > rect.height / 2;
            volumeListEl.insertBefore(draggedVolume, after ? card.nextSibling : card);
        });
    });

    function saveVolumeOrder() {
        const ids = [...volumeListEl.querySelectorAll('.volume-card')]
            .map(c => parseInt(c.dataset.volumeId, 10));

        fetch(`/products/${productId}/volumes/reorder`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(ids)
        }).catch(() => {});
    }

    // ---------- KÉO THẢ SẮP XẾP CHƯƠNG (bật bằng nút "Sắp xếp chương") ----------
    document.querySelectorAll('.sort-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
            const volumeId = btn.dataset.volumeId;
            const list = document.querySelector(`.chapter-list[data-volume-id="${volumeId}"]`);
            const isActive = btn.classList.toggle('active');

            list.querySelectorAll('.chapter-item').forEach(li => {
                li.classList.toggle('sortable', isActive);
                li.setAttribute('draggable', isActive ? 'true' : 'false');
                // Khi đang sắp xếp thì tắt link để khỏi bấm nhầm vào đọc chương
                const link = li.querySelector('.c-title');
                if (isActive) {
                    link.dataset.href = link.getAttribute('href');
                    link.removeAttribute('href');
                } else if (link.dataset.href) {
                    link.setAttribute('href', link.dataset.href);
                }
            });

            btn.textContent = isActive ? '✓ Xong sắp xếp' : '⇅ Sắp xếp chương';
        });
    });

    let draggedChapter = null;
    document.querySelectorAll('.chapter-list').forEach(list => {
        const volumeId = list.dataset.volumeId;

        list.addEventListener('dragstart', e => {
            const li = e.target.closest('.chapter-item');
            if (!li || !li.classList.contains('sortable')) return;
            draggedChapter = li;
            li.classList.add('dragging');
        });

        list.addEventListener('dragend', e => {
            const li = e.target.closest('.chapter-item');
            if (li) li.classList.remove('dragging');
            if (draggedChapter) saveChapterOrder(list, volumeId);
            draggedChapter = null;
        });

        list.addEventListener('dragover', e => {
            if (!draggedChapter) return;
            e.preventDefault();
            const li = e.target.closest('.chapter-item');
            if (!li || li === draggedChapter) return;
            const rect = li.getBoundingClientRect();
            const after = (e.clientY - rect.top) > rect.height / 2;
            list.insertBefore(draggedChapter, after ? li.nextSibling : li);
        });
    });

    function saveChapterOrder(list, volumeId) {
        const ids = [...list.querySelectorAll('.chapter-item')]
            .map(li => parseInt(li.dataset.chapterId, 10));

        fetch(`/products/volume/${volumeId}/chapters/reorder`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(ids)
        }).catch(() => {});
    }
</script>

</body>
</html>
