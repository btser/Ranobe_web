<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="${siteLogoSmall}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${profileUser.userName} + ' - Ranobe Kingdom'">Hồ sơ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #121212; color: #e0e0e0; }
        a { color: inherit; text-decoration: none; }

        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #1e1e1e; padding: 15px 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
        .logo { font-size: 22px; font-weight: bold; color: #4da6ff; }
        .logo { display: inline-flex; align-items: center; gap: 10px; }
        .logo img { width: 38px; height: 38px; border-radius: 10px; display: block; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .btn { padding: 8px 16px; border-radius: 4px; font-weight: bold; font-size: 14px; transition: 0.2s; display: inline-block; }
        .btn-login { border: 1px solid #4da6ff; color: #4da6ff; }
        .btn-login:hover { background: #4da6ff; color: #fff; }
        .btn-logout { background: #dc3545; color: #fff; }
        .user-name { color: #ffca28; font-weight: bold; }

        .wrap { max-width: 1100px; margin: 20px auto; padding: 0 16px; }

        /* Header hồ sơ */
        .head { background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 4px; overflow: hidden; }
        .banner { height: 240px; background: linear-gradient(135deg, #243b55, #141e30 60%, #3a2a55); position: relative; }
        .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .head-bar { display: flex; align-items: center; gap: 18px; padding: 10px 20px 14px 150px; min-height: 56px; position: relative; }
        .avatar { position: absolute; left: 20px; top: -60px; width: 112px; height: 112px; border-radius: 50%;
                  border: 4px solid #1a1a1a; background: #3b82f6; color: #fff; font-size: 44px; font-weight: bold;
                  display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .p-name { font-size: 20px; font-weight: bold; flex: 1; }
        .btn-edit { background: #28a745; color: #fff; }
        .btn-edit:hover { background: #218838; }

        /* Thân trang */
        .body { display: grid; grid-template-columns: 280px 1fr; gap: 20px; margin-top: 20px; align-items: start; }
        .side { background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 4px; padding: 16px; }
        .side .intro { line-height: 1.55; margin: 0 0 16px; white-space: pre-line; word-break: break-word; }
        .side .intro.empty { color: #888; font-style: italic; }
        .stat { text-align: center; padding: 14px 0; border-top: 1px solid #2c2c2c; border-bottom: 1px solid #2c2c2c; margin-bottom: 14px; }
        .stat .num { font-size: 26px; font-weight: bold; }
        .stat .lbl { color: #888; font-size: 13px; }
        .info div { margin: 8px 0; font-size: 14px; color: #aaa; }
        .info b { color: #e0e0e0; font-weight: 600; }

        .sec-title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: bold; padding-bottom: 10px; border-bottom: 1px solid #2c2c2c; margin: 0 0 16px; }
        .sec-title .count { background: #000; color: #fff; padding: 4px 9px; border-radius: 3px; font-size: 16px; }

        .works { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        .work { display: flex; background: #1a1a1a; border: 1px solid #2c2c2c; border-radius: 4px; overflow: hidden; transition: border-color .2s; }
        .work:hover { border-color: #4da6ff; }
        .work .thumb { width: 150px; flex-shrink: 0; aspect-ratio: 16 / 9; align-self: stretch; background: #2a2a2a; }
        .work .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .work-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .tag { align-self: flex-start; background: #1fa971; color: #fff; font-size: 11px; font-weight: bold; padding: 2px 7px; border-radius: 3px; }
        .work-title { font-weight: bold; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .work-meta { font-size: 13px; color: #aaa; margin-top: auto; }
        .work-meta b { color: #e0e0e0; }
        .empty-works { color: #888; }

        @media (max-width: 800px) {
            .body { grid-template-columns: 1fr; }
            .banner { height: 160px; }
            .head-bar { padding-left: 20px; padding-top: 60px; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="/" class="logo"><img th:src="${siteLogoSmall}" alt="LN"> Ranobe Kingdom</a>
    <div class="nav-links">
        <th:block th:if="${user == null}">
            <a href="/login" class="btn btn-login">Đăng Nhập</a>
        </th:block>
        <th:block th:if="${user != null}">
            <a th:href="@{'/users/' + ${user.userId}}" class="user-name" th:text="${user.userName}">Tên</a>
            <a th:if="${isStaff}" href="/admin" class="btn btn-login">Quản trị</a>
            <a href="/logout" class="btn btn-logout">Đăng Xuất</a>
        </th:block>
    </div>
</nav>

<div class="wrap">

    <!-- HEADER: bìa + avatar + tên -->
    <div class="head">
        <div class="banner">
            <img th:if="${!#strings.isEmpty(profileUser.coverUrl)}" th:src="${profileUser.coverUrl}"
                 alt="Ảnh bìa" onerror="this.remove()"/>
        </div>
        <div class="head-bar">
            <div class="avatar">
                <span th:text="${!#strings.isEmpty(profileUser.userName) ? #strings.substring(profileUser.userName, 0, 1).toUpperCase() : '?'}">T</span>
                <img th:if="${!#strings.isEmpty(profileUser.avatarUrl)}" th:src="${profileUser.avatarUrl}"
                     alt="Avatar" onerror="this.remove()"/>
            </div>
            <div class="p-name" th:text="${profileUser.userName}">Tên người dùng</div>
            <a th:if="${isOwner}" th:href="@{/profile/edit}" class="btn btn-edit">✏️ Chỉnh sửa hồ sơ</a>
        </div>
    </div>

    <div class="body">
        <!-- CỘT TRÁI -->
        <aside class="side">
            <p class="intro" th:if="${!#strings.isEmpty(profileUser.introduce)}" th:text="${profileUser.introduce}">Giới thiệu</p>
            <p class="intro empty" th:if="${#strings.isEmpty(profileUser.introduce)}">Chưa có giới thiệu.</p>

            <div class="stat">
                <div class="num" th:text="${#lists.size(products)}">0</div>
                <div class="lbl">Truyện đã đăng</div>
            </div>

            <div class="info">
                <div th:if="${profileUser.birth != null}">🎂 Ngày sinh:
                    <b th:text="${#dates.format(profileUser.birth, 'dd/MM/yyyy')}">01/01/2000</b></div>
                <div th:if="${!#strings.isEmpty(profileUser.hobby)}">⭐ Sở thích:
                    <b th:text="${profileUser.hobby}">đọc truyện</b></div>
            </div>
        </aside>

        <!-- CỘT PHẢI -->
        <main>
            <h2 class="sec-title">
                <span class="count" th:text="${#lists.size(products)}">0</span>
                Truyện đã đăng
            </h2>

            <div th:if="${canManageAccount}" class="admin-actions">
                <form th:if="${profileAccount != null and !profileAccount.deleted}"
                    th:action="@{'/users/' + ${profileUser.userId} + '/ban'}"
                    method="post"
                    onsubmit="return confirm('Ban tài khoản này?');">
                    <button type="submit" class="btn btn-ban">Ban tài khoản</button>
                </form>

                <form th:if="${profileAccount != null and profileAccount.deleted}"
                    th:action="@{'/users/' + ${profileUser.userId} + '/unban'}"
                    method="post">
                    <button type="submit" class="btn btn-unban">Mở ban</button>
                </form>
            </div>

            <div class="works">
                <a class="work" th:each="p : ${products}" th:href="@{${p.path}}">
                    <div class="thumb">
                        <img th:src="${#strings.isEmpty(p.coverImage)} ? ${siteDefaultCover} : ${p.coverImage}"
                             th:data-fallback="${siteDefaultCover}" onerror="this.onerror=null;this.src=this.dataset.fallback"
                             loading="lazy" alt="Bìa"/>
                    </div>
                    <div class="work-body">
                        <span class="tag" th:each="c : ${p.categories}" th:text="${c.categoryName}">Thể loại</span>
                        <span class="tag" th:if="${#sets.isEmpty(p.categories) and p.category != null}" th:text="${p.category.categoryName}">Thể loại</span>
                        <div class="work-title" th:text="${p.title}">Tên truyện</div>
                        <div class="work-meta"><b>Trạng thái:</b> <span th:text="${p.status}">PUBLIC</span></div>
                    </div>
                </a>
            </div>

            <p class="empty-works" th:if="${#lists.isEmpty(products)}">Chưa đăng truyện nào.</p>
        </main>
    </div>
</div>

</body>
</html>
