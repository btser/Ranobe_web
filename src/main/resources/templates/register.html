<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #121212; color: #e0e0e0; }
        .card { max-width: 400px; margin: 30px auto; background: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-top: 4px solid #28a745; }
        h2 { text-align: center; color: #28a745; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .error-msg { color: #ff4d4d; text-align: center; margin-bottom: 15px; }
        .link { display: block; text-align: center; margin-top: 15px; color: #888; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Register</h2>
        
        <div th:if="${error}" class="error-msg" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label>Tên hiển thị:</label>
                <input type="text" name="userName" required placeholder=""/>
            </div>

            <div class="form-group">
                <label>Gmail:</label>
                <input type="gmail" name="gmail" required placeholder="@gmail.com"/>
            </div>

            <div class="form-group">
                <label>Username:</label>
                <input type="text" name="username" required placeholder=""/>
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" required placeholder=""/>
            </div>

            <button type="submit">Submit</button>
            <a href="/login" class="link">I already have an account</a>
        </form>
    </div>

</body>
</html>
